name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Engine and language
        run: node --test tests/*.test.js
      - name: Every section in headless Chrome, under the production CSP
        env:
          CHROME: google-chrome
        run: |
          python3 dev/serve.py &
          sleep 1
          node dev/smoke.mjs
          node dev/smoke.mjs --width 390 --shots screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: phone-screenshots
          path: screenshots
          if-no-files-found: ignore
